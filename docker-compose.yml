services:
  db-main:
    image: ankane/pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
  db-data:
    image: postgres:alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DATA_DATABASE_USER}
      POSTGRES_PASSWORD: ${DATA_DATABASE_PASSWORD}
      POSTGRES_DB: ${DATA_DATABASE_NAME}
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  main-api:
    build:
      context: .
      dockerfile: app/main-api/Dockerfile
    depends_on:
      - db-main
      - redis
      - rabbitmq
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db-main
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      REDIS_URL: redis://redis:6379
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
  data-processing:
    build:
      context: .
      dockerfile: app/data-processing/Dockerfile
    depends_on:
      - db-data
      - rabbitmq
    env_file:
      - .env
    environment:
      DATA_DATABASE_HOST: db-data
      DATA_DATABASE_PORT: 5432
      DATA_DATABASE_USER: ${DATA_DATABASE_USER}
      DATA_DATABASE_PASSWORD: ${DATA_DATABASE_PASSWORD}
      DATA_DATABASE_NAME: ${DATA_DATABASE_NAME}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
